# nginx for the Blazor WebAssembly files. nginx-unprivileged listens on 8080 as user 101
# and writes its pid and temp files to /tmp (an emptyDir in Kubernetes, the rest is read-only).
# /api/* is handled by /etc/nginx/api.conf: api-404.conf in the image (in the cluster,
# Cloudflare Tunnel sends /api/* to edgeservice, so it never gets here), and
# api-proxy.conf in docker-compose.yml (forwards to the real edgeservice).
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    # dotnet publish writes .gz copies of the files next to them.
    gzip_static on;

    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    include /etc/nginx/api.conf;

    # Blazor routes (/login, /admin, ...) are client-side: unknown paths get index.html.
    # app.css, Frontend.Web.styles.css, favicon etc. keep their names between deploys, so
    # Cloudflare and the browser must ask again each time (cheap: 304 via ETag). Without a
    # Cache-Control header Cloudflare keeps them for 4 hours and serves old CSS with new HTML.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }

    # index.html names the fingerprinted files, so it must never be cached.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # _framework/* file names contain a hash, so they can be cached for a long time.
    location /_framework/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
        error_page 404 = @framework_missing;
    }

    # SCRUM-130: Cloudflare caches /_framework/ (cache rule "Slopster frontend", respect origin).
    # A 404 has no Cache-Control of its own, and Cloudflare would then keep it for a few
    # minutes. During a deploy the new index.html can ask an old pod for a new file name, and
    # that 404 must not stick, so a missing file says no-store.
    location @framework_missing {
        add_header Cache-Control "no-store" always;
        return 404;
    }
}
