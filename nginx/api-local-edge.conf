# Local development only (docker-compose.local-edge.yml): forward /api/* to an
# edgeservice running on this machine (EdgeService repo, docker compose, port 5000).
# Which services that edge sends to your machine and which to the real cluster is
# decided by the overrides in EdgeService/local/. WebSockets (SignalR) go through as well.
location /api/ {
    proxy_pass http://host.docker.internal:5000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $http_connection;
    proxy_read_timeout 1h;  # keep SignalR connections open
}
