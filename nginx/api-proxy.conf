# Local development only (docker-compose.yml): forward /api/* to the real edgeservice
# at https://quiz.munkcloud.dk, so the app runs against real data. The browser only
# sees localhost, so there is no CORS. WebSockets (SignalR) go through as well.
location /api/ {
    proxy_pass https://quiz.munkcloud.dk;
    proxy_http_version 1.1;
    proxy_set_header Host quiz.munkcloud.dk;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $http_connection;
    proxy_ssl_server_name on;
    proxy_ssl_name quiz.munkcloud.dk;
    proxy_ssl_verify on;
    # quiz.munkcloud.dk's certificate chains to Let's Encrypt's newer "ISRG Root YE", which the
    # CA bundle in nginx-unprivileged:1.29-alpine does not have yet, so that root is mounted
    # from nginx/upstream-ca.pem. If Cloudflare switches CA, put the new root in that file.
    proxy_ssl_trusted_certificate /etc/nginx/upstream-ca.pem;
    proxy_ssl_verify_depth 3;
    proxy_read_timeout 1h;  # keep SignalR connections open
    # nginx's default client_max_body_size (1m) would answer 413 to admin song uploads
    # (POST /api/musicservice/playlists/{id}/songs, multipart mp3). The edge allows 200 MB on
    # that route; in production Cloudflare caps request bodies at 100 MB.
    client_max_body_size 200m;
}
