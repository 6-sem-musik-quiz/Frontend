# nginx for the Blazor WebAssembly files. nginx-unprivileged listens on 8080 as user 101
# and writes its pid and temp files to /tmp (an emptyDir in Kubernetes, the rest is read-only).
# /api/* never reaches this server: Cloudflare Tunnel sends it to edgeservice.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    # dotnet publish writes .gz copies of the files next to them.
    gzip_static on;

    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Belongs to edgeservice. If a call ends up here (e.g. locally without the tunnel),
    # answer 404 instead of index.html, so the app shows an error rather than parsing HTML.
    location /api/ {
        return 404;
    }

    # Blazor routes (/login, /admin, ...) are client-side: unknown paths get index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html names the fingerprinted files, so it must never be cached.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # _framework/* file names contain a hash, so they can be cached for a long time.
    location /_framework/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }
}
