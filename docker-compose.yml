# Runs the production image locally against the REAL backend: nginx serves the app
# on http://localhost:5006 and forwards /api/* to https://quiz.munkcloud.dk
# (edgeservice in the cluster). This is live data, so what you create or delete
# here is real.
#
#   docker compose up --build
#
# docker-compose.local-edge.yml swaps the real edge for one on your own machine.
services:
  web:
    build: .                     # build the Dockerfile in this repo (Blazor app + nginx)
    ports:
      - "5006:8080"              # your machine's port 5006 -> nginx's port 8080 in the container
    volumes:
      # nginx includes /etc/nginx/api.conf for /api/*. This one proxies to the real edge.
      - ./nginx/api-proxy.conf:/etc/nginx/api.conf:ro
      # The certificate authority nginx trusts when it talks HTTPS to the real edge.
      - ./nginx/upstream-ca.pem:/etc/nginx/upstream-ca.pem:ro
